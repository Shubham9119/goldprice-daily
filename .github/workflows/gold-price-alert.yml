name: Gold price alert

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) every day. Cron is always UTC.
    # Adjust the UTC time below if you want a different IST trigger time.
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: read   # least privilege: this job only needs to read the repo

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # bound the job so a hung request can't run forever
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold price alert
        env:
          # These are read from encrypted GitHub Secrets — never hardcode
          # real values here. Set them under Repo Settings > Secrets and
          # variables > Actions.
          GOLD_API_TOKEN: ${{ secrets.GOLD_API_TOKEN }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_price_alert.py
